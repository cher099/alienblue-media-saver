name: Build iOS tweak

on:
  push:
    branches: [ main, feature/redalien-ffmpeg-playback, fix/save-to-photos-all-media ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl sudo build-essential git perl make fakeroot dpkg-dev xz-utils libtinfo6

      - name: Install Theos, toolchain, and iOS SDK
        env:
          THEOS: ${{ runner.temp }}/theos
          CI: "1"
        run: |
          export THEOS
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build ARMv7 package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          make package FINALPACKAGE=1

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: RedGIFsCompat-deb
          path: packages/*.deb
          if-no-files-found: error
